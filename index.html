
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header>
        <div>
            <h1>Scientific Calculator</h1>
            <p>Smart calculation experience</p>
        </div>
        <button id="historyToggle" class="history-btn">
            History
        </button>
    </header>

    <main class="calculator">

        <div class="display">
            <div class="top-display">
                <span id="mode">DEG</span>
                <span id="previous"></span>
            </div>

            <div id="expression" class="expression"></div>
            <div id="result" class="result">0</div>
        </div>

        <div class="mode-row">
            <button id="angleMode">DEG</button>
            <button data-action="clear">AC</button>
            <button data-action="delete">DEL</button>
            <button data-value="%">%</button>
        </div>

        <div class="buttons">

            <button data-value="sin(">sin</button>
            <button data-value="cos(">cos</button>
            <button data-value="tan(">tan</button>
            <button data-value="sqrt(">√</button>

            <button data-value="log(">log</button>
            <button data-value="ln(">ln</button>
            <button data-value="(">(</button>
            <button data-value=")">)</button>

            <button data-value="^2">x²</button>
            <button data-value="^">xʸ</button>
            <button data-value="!">n!</button>
            <button data-value="pi">π</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="/">÷</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="*">×</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value="-">−</button>

            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button data-value="e">e</button>
            <button data-value="+">+</button>

            <button data-action="answer" class="answer-btn">Ans</button>
            <button data-action="calculate" class="equal-btn">=</button>

        </div>
    </main>

    <aside id="historyPanel" class="history-panel hidden">
        <div class="history-header">
            <h2>Calculation History</h2>
            <button id="closeHistory">✕</button>
        </div>
        <div id="historyList"></div>
        <button id="clearHistory" class="clear-history">
            Clear History
        </button>
    </aside>

    <footer>
        <p>Scientific Calculator | Final Year Project</p>
        <p>Built using HTML, CSS & JavaScript</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
